<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Families Dashboard - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo img {
            height: 60px;
        }
        
        .title {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
            font-weight: bold;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .login-btn:hover {
            background: #5a6fd8;
        }
        
        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
        }
        
        .loading.show {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="public/Awwa2-logo.png" alt="AWWA Logo">
        </div>
        
        <h1 class="title">Sign In to Continue</h1>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="userId">User ID:</label>
                <input type="text" id="userId" name="userId" value="aditi" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" value="admin123" required>
            </div>
            
            <div class="form-group">
                <label for="userType">User Type:</label>
                <select id="userType" name="userType" required>
                    <option value="">Select Type</option>
                    <option value="L1">L1</option>
                    <option value="L2" selected>L2</option>
                    <option value="L3">L3</option>
                    <option value="L4">L4</option>
                </select>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">Sign In</span>
                <span id="loading" class="loading">Signing In...</span>
            </button>
        </form>
        
        <div id="message"></div>
    </div>

    <script>
        // Valid users
        const validUsers = [
            { userId: 'aditi', password: 'admin123', userType: 'L2', name: 'ADITI' }
        ];

        // Get form elements
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');
        const message = document.getElementById('message');

        // Show message function
        function showMessage(text, type) {
            message.innerHTML = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }

        // Hide message function
        function hideMessage() {
            message.style.display = 'none';
        }

        // Set loading state
        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                btnText.style.display = 'none';
                loading.classList.add('show');
            } else {
                loginBtn.disabled = false;
                btnText.style.display = 'inline';
                loading.classList.remove('show');
            }
        }

        // Handle form submission
        function handleLogin(event) {
            event.preventDefault();
            
            // Get form values
            const userId = document.getElementById('userId').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const userType = document.getElementById('userType').value;

            // Validate inputs
            if (!userId || !password || !userType) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            // Set loading state
            setLoading(true);
            hideMessage();

            // Simulate network delay
            setTimeout(() => {
                // Check credentials
                const user = validUsers.find(u => 
                    u.userId === userId && 
                    u.password === password && 
                    u.userType === userType
                );

                if (user) {
                    // Store user info
                    const userInfo = {
                        userId: userId,
                        name: user.name,
                        userType: userType
                    };
                    localStorage.setItem('userInfo', JSON.stringify(userInfo));

                    // Show success message
                    showMessage('Login successful! Redirecting...', 'success');
                    
                    // Redirect after delay
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    // Show error message
                    showMessage('Invalid credentials. Try: aditi / admin123 / L2', 'error');
                    setLoading(false);
                }
            }, 1000);
        }

        // Add event listener when page loads
        window.addEventListener('load', function() {
            console.log('Page loaded, setting up login form');
            
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
                console.log('Event listener added successfully');
            } else {
                console.error('Login form not found!');
            }
        });

        // Also try when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM ready, setting up login form');
            
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
                console.log('Event listener added successfully');
            } else {
                console.error('Login form not found!');
            }
        });
    </script>
</body>
</html>
