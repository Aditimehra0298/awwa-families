<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Families Dashboard - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            margin-bottom: 20px;
        }
        
        .logo img {
            height: 50px;
        }
        
        .header-image {
            margin-bottom: 15px;
        }
        
        .header-image img {
            width: 100%;
            max-width: 300px;
            height: auto;
        }
        
        .signin-text {
            color: #666;
            font-size: 18px;
            font-weight: 500;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            display: none;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .loading {
            display: none;
        }
        
        .loading.show {
            display: inline-block;
        }
        
        .btn-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <div class="logo">
                <img src="public/Awwa2-logo.png" alt="AWWA Logo">
            </div>
            
            <div class="header-image">
                <img src="public/Untitled (1800 x 1080 px) (2).png" alt="AWWA Header">
            </div>
            
            <p class="signin-text">Sign in to continue</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" name="userId" value="aditi" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="admin123" required>
            </div>
            
            <div class="form-group">
                <label for="userType">User Type</label>
                <select id="userType" name="userType" required>
                    <option value="">Select your role</option>
                    <option value="L1">L1</option>
                    <option value="L2" selected>L2</option>
                    <option value="L3">L3</option>
                    <option value="L4">L4</option>
                </select>
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">
                <div class="btn-content">
                    <span id="btnText">Sign In</span>
                    <div id="spinner" class="spinner loading"></div>
                </div>
            </button>
        </form>
        
        <div id="message"></div>
        
        <div class="footer">
            © 2025 AWWA. All rights reserved.
        </div>
    </div>

    <script>
        // Valid users
        const validUsers = [
            { userId: 'aditi', password: 'admin123', userType: 'L2', name: 'ADITI' }
        ];

        // Get form elements
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const message = document.getElementById('message');

        // Show message function
        function showMessage(text, type) {
            message.innerHTML = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }

        // Hide message function
        function hideMessage() {
            message.style.display = 'none';
        }

        // Set loading state
        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                btnText.textContent = 'Signing In...';
                spinner.classList.add('show');
            } else {
                loginBtn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.classList.remove('show');
            }
        }

        // Handle form submission
        function handleLogin(event) {
            event.preventDefault();
            
            // Get form values
            const userId = document.getElementById('userId').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const userType = document.getElementById('userType').value;

            // Validate inputs
            if (!userId || !password || !userType) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            // Set loading state
            setLoading(true);
            hideMessage();

            // Simulate network delay
            setTimeout(() => {
                // Check credentials
                const user = validUsers.find(u => 
                    u.userId === userId && 
                    u.password === password && 
                    u.userType === userType
                );

                if (user) {
                    // Store user info
                    const userInfo = {
                        userId: userId,
                        name: user.name,
                        userType: userType
                    };
                    localStorage.setItem('userInfo', JSON.stringify(userInfo));

                    // Show success message
                    showMessage('Login successful! Redirecting to dashboard...', 'success');
                    
                    // Redirect after delay
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    // Show error message
                    showMessage('Invalid credentials. Please check your details and try again.<br><br>Hint: Try aditi / admin123 / L2', 'error');
                    setLoading(false);
                }
            }, 1500);
        }

        // Initialize when page loads
        function initializeLogin() {
            console.log('Initializing login form...');
            
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
                console.log('Login form event listener added successfully');
            } else {
                console.error('Login form element not found!');
            }
        }

        // Try multiple initialization methods
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeLogin);
        } else {
            initializeLogin();
        }

        // Also try when window loads
        window.addEventListener('load', initializeLogin);
    </script>
</body>
</html>
